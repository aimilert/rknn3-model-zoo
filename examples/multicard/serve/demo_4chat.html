<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>4 路并发推理演示</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef;
          --dim:#8b94a7; --accent:#4da3ff; --ok:#3ddc84; --warn:#ffb454;
          --danger:#ff6b6b; --sunken:#0d1017; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
           padding:12px 18px; border-bottom:1px solid var(--line); background:#12151b; }
  .brand { display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:0; }
  h1 { font-size:17px; margin:0; font-weight:600; letter-spacing:.3px; }

  /* 状态徽标：一个灯 + 一两个词。灯的颜色**由 JS 换 class**（.badge.<state>），不是写死的
     emoji —— emoji 在 Windows/安卓/iOS 上长得不一样，投影出来还可能是个方框。 */
  .badge { display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 8px;
           border:1px solid var(--line); border-radius:999px; background:var(--sunken);
           color:var(--dim); font-size:13px; white-space:nowrap;
           font-variant-numeric:tabular-nums; }
  .badge .led { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .badge.idle { color:var(--ok); border-color:#1f3a2b; }
  .badge.idle .led { background:var(--ok); box-shadow:0 0 6px rgba(61,220,132,.65); }
  .badge.busy { color:var(--warn); border-color:#3d3120; }
  .badge.busy .led { background:var(--warn); box-shadow:0 0 6px rgba(255,180,84,.65);
                     animation:pulse 1.1s infinite; }
  .badge.wait { color:var(--accent); border-color:#1e3550; }
  .badge.wait .led { background:var(--accent); animation:pulse 1.1s infinite; }
  .badge.err { color:var(--danger); border-color:#43222a; }
  .badge.err .led { background:var(--danger); }
  #gstats { font-variant-numeric:tabular-nums; }

  /* 右侧控件组：一行排开、垂直居中、间距 16px。 */
  .controls { margin-left:auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  label.tog { color:var(--dim); font-size:13px; display:flex; align-items:center; gap:6px;
              cursor:pointer; }
  /* 复选框自己画：`accent-color` 只管**勾上**之后那个方块的颜色，**没勾时浏览器照样画
     一个纯白方块** —— 深色页面上最扎眼的就是它（而且是默认状态）。 */
  input[type=checkbox] { appearance:none; -webkit-appearance:none; position:relative; margin:0;
                         width:15px; height:15px; border:1px solid var(--line); border-radius:4px;
                         background:var(--sunken); cursor:pointer;
                         transition:background .15s,border-color .15s; }
  input[type=checkbox]:hover { border-color:#3d4657; }
  input[type=checkbox]:checked { background:var(--accent); border-color:var(--accent); }
  input[type=checkbox]:checked::after { content:""; position:absolute; left:4px; top:1px;
                                        width:4px; height:8px; border:solid #06121f;
                                        border-width:0 2px 2px 0; transform:rotate(45deg); }
  input[type=checkbox]:focus-visible { outline:2px solid rgba(77,163,255,.45); outline-offset:1px; }

  /* 数字输入框：外框自己画、内阴影压在里层。**不用裸 input** —— 浏览器默认那圈 inset 在深色
     底上几乎看不见，投影仪下就是个没有边界的数字。 */
  .numbox { display:inline-flex; align-items:center; gap:3px; padding:2px 8px;
            background:var(--sunken); border:1px solid var(--line); border-radius:6px;
            box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
            transition:border-color .15s,box-shadow .15s; }
  .numbox:hover { border-color:#31384a; }
  .numbox:focus-within { border-color:var(--accent);
                         box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 0 0 2px rgba(77,163,255,.16); }
  .numbox input[type=number] { width:58px; padding:2px 0; border:0; background:transparent;
                               color:var(--fg); font:inherit; font-size:13px; text-align:right;
                               outline:0; font-variant-numeric:tabular-nums;
                               -moz-appearance:textfield; }
  .numbox input[type=number]::-webkit-outer-spin-button,
  .numbox input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .numbox .unit { color:var(--dim); font-size:12px; }

  /* 按钮三级：主（亮蓝实心）/ 次（描边透明）/ 危险（深灰，hover 才红）。
     基础 button 是**中性**的 —— 没挂变体类的按钮不该被误当成主按钮。 */
  button { border:1px solid transparent; border-radius:6px; padding:8px 15px; font-size:14px;
           font-weight:600; cursor:pointer; font-family:inherit; background:#222836;
           color:var(--fg); transition:background .15s,border-color .15s,color .15s; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .btn-primary { background:var(--accent); color:#06121f; }
  .btn-primary:hover:not(:disabled) { background:#6cb2ff; }
  .btn-secondary { background:transparent; border-color:var(--line); color:var(--fg);
                   font-weight:500; }
  .btn-secondary:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .btn-danger { background:#222836; color:var(--dim); font-weight:500; }
  .btn-danger:hover:not(:disabled) { background:#3a1d22; color:var(--danger); }

  /* 顶部那行汇总（单路基线 / 四路聚合）。**空的时候不占高度** —— 没消息就不留一条白带。 */
  .sumline { color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
  .sumline:not(:empty) { padding:9px 18px; border-bottom:1px solid var(--line); background:#12151b; }
  .sumline b { color:var(--ok); font-size:15px; }

  main { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           display:flex; flex-direction:column; height:calc(50vh - 60px); min-height:300px; }
  .panel.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .phead { display:flex; align-items:center; gap:8px; padding:9px 14px;
           border-bottom:1px solid var(--line); font-size:13px; }
  .phead .name { font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:#3a4150; }
  .dot.on { background:var(--accent); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  /* 面板头右侧的性能小字：TTFT + tok/s。**和底部统计行不是一回事** —— 底部那行是记账
     （token 数、排队拆解、会话与 KV），这里只给投影仪/基准测试看两个数（见 setPerf）。 */
  .phead .perf { margin-left:auto; color:var(--dim); font-size:12px; white-space:nowrap;
                 font-variant-numeric:tabular-nums; }
  .phead .perf b { color:var(--fg); font-weight:600; }
  .log { flex:1; overflow-y:auto; padding:14px 16px; }
  .msg { margin-bottom:10px; white-space:pre-wrap; word-break:break-word; }
  .msg .who { color:var(--dim); font-size:11px; display:block; }
  .msg.u .body { color:var(--accent); }
  .msg.a .body { color:var(--fg); }
  .msg.err .body { color:var(--danger); }
  .pfoot { border-top:1px solid var(--line); padding:10px 12px;
           display:flex; gap:8px; align-items:flex-end; }
  /* 输入区：多行、高度随内容长（grow()），发送键**内嵌在框里**右下角。内嵌而不是并排，
     是因为框长高时并排的按钮得跟着重新对齐 —— 嵌进去就永远贴着那一角。 */
  .inbox { position:relative; flex:1; min-width:0; }
  .inbox textarea { display:block; width:100%; resize:none; overflow-y:hidden;
                    background:var(--sunken); border:1px solid var(--line); color:var(--fg);
                    border-radius:8px; padding:9px 44px 9px 11px; font:inherit; font-size:14px;
                    line-height:1.5; max-height:120px;
                    transition:border-color .15s,box-shadow .15s; }
  .inbox textarea::placeholder { color:#5a6274; }
  .inbox textarea:focus { outline:0; border-color:var(--accent);
                          box-shadow:0 0 0 2px rgba(77,163,255,.16); }
  .inbox .send { position:absolute; right:7px; bottom:7px; width:30px; height:30px; padding:0;
                 display:flex; align-items:center; justify-content:center;
                 background:var(--accent); color:#06121f; border-radius:7px; }
  .inbox .send:hover:not(:disabled) { background:#6cb2ff; }
  .stat { padding:6px 16px 10px; color:var(--dim); font-size:12px;
          font-variant-numeric:tabular-nums; min-height:24px; }
  .stat b { color:var(--ok); }
  .hint { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>4 路并发推理 · Qwen3.5-27B · RK1828 ×4</h1>
    <!-- 徽标里那句字是 JS 写的（setStatus），灯的颜色也是 JS 换的 -->
    <span id="status" class="badge idle"><i class="led"></i><span id="gstats">待机</span></span>
  </div>
  <div class="controls">
    <label class="tog"><input type="checkbox" id="think"> 开思考（默认关，屏幕更干净）</label>
    <label class="tog">输出上限
      <span class="numbox"><input type="number" id="maxtok" min="1" step="64"><span class="unit">tok</span></span>
    </label>
    <button id="baseline" class="btn-secondary">① 先量单路基线</button>
    <button id="all" class="btn-primary">② 4 路同时提问</button>
    <button id="clear" class="btn-danger">清空</button>
  </div>
</header>

<!-- 基线/四路聚合那一整句（setSum）。**和徽标分开**：徽标只有一个词，这行是一句话，
     以前两者挤在 #gstats 里，一句汇总能把标题行撑到换行。 -->
<div id="gsum" class="sumline"></div>

<main id="grid"></main>

<script>
"use strict";
const API = "";                       // 空 = 同源（页面由网关自己发出，见 GET /demo）
const MODEL = "qwen3.5-27b";
// 输出上限。**原先是写死的**（`const MAXTOK = 256`），于是同一个板上、同样的问题，
// 网页永远比终端短一截——终端版是从命令行取的（demo_4session.py 的 NP）。这不是模型或
// 网关的限制：网关 `_pick_max_tokens` 只把离谱值夹到 2^31-1、不设小上限；后端 main.cc 也会
// 在 `decode_tokens >= max_new_tokens` 时如实回 `finish_reason=length`。纯粹是这一页少了
// 个开关。现在给了，并且记住上次的值（演示要对好几个数，刷新一次重填很烦）。
//
// 它是**按请求**生效的：每轮带自己的 max_tokens 发出去，改大了不会补上已经截断的那一轮，
// 得重问。而且真正卡住输出的常常不是它、是上下文——位置用满时后端也会停，
// 那时 finish_reason 未必是 length。所以统计行只在字面收到 length 时才敢标"触顶截断"。
const DEFAULT_MAXTOK = 256;
const MAXTOK_KEY = "demo4chat.maxtok";

function maxtok() {
  const raw = parseInt(document.getElementById("maxtok").value, 10);
  // 空/非法/<=0 一律退回默认。**不能让它漏成 0 发出去**：网关把 0 当"用后端自己的默认值"
  // （`_pick_max_tokens` 的 `return 0`），那一轮实际吐多少就跟这一页显示的设定对不上了。
  return (raw > 0) ? raw : DEFAULT_MAXTOK;
}

(function initMaxtok() {
  const el = document.getElementById("maxtok");
  let saved = NaN;
  try { saved = parseInt(localStorage.getItem(MAXTOK_KEY), 10); }
  catch (e) { /* 隐私模式 / 禁用 storage：用默认值就好，别让整页脚本挂在这儿 */ }
  el.value = (saved > 0) ? saved : DEFAULT_MAXTOK;
  // 回写一次生效值：输入框里显示的数必须就是真发出去的数，否则"我明明设了 2000"会变成
  // 一场查不出原因的罗生门（比如粘进来个 "2,000"，parseInt 只认前面那个 2）
  el.addEventListener("change", function () {
    el.value = maxtok();
    try { localStorage.setItem(MAXTOK_KEY, String(el.value)); } catch (e) {}
  });
})();

// 这四问是**四个面板各自的第一问**。它们相同也没关系——四路是四段对话这件事
// 由显式身份（`web-1`..`web-4`，见 streamChat）保证，不再靠"问题不一样"来区分。
// （v1.9 之前靠内容区分：网关按 `system + 首问` 认对话，两路问同一句话就会被当成
// 同一段对话、落到同一个会话上排队——那是"轮流"，不是并发，而且答案全对、看不出来。）
//
// 为什么默认问题这么"机械"：这种列举型任务模型会**直接开始输出**，不会先写一大段
// 思考过程。换成"介绍一下杭州"这类需要组织语言的问题，实测在关思考的软开关下
// 仍会吐 <think>，而且常常在 think 段里就被 max_tokens 截断——网关此时按设计
// **原样吐出**（宁可露标签也不静默吞内容），投影出来就是满屏 "Analyze the Request"。
// 演示时当然可以随便问，只是默认这四问是挑过的。
// 四个都挑过：实测 150~190 tok、13~17 秒、**都不吐 <think>**。时长接近是有意的——
// 四路里最短的那路一下线，屏幕上就只剩三行在动，"四路同时"的画面只维持很短一段。
const DEFAULT_Q = [
  "List the numbers from 1 to 40 separated by commas.",
  "List the multiples of 5 from 5 to 200 separated by commas.",
  "Count down from 50 to 1 separated by commas.",
  "List the even numbers from 2 to 80 separated by commas.",
];

const panels = [];
let lastSingleRate = null;     // 单路基线（只有一路在跑时记下来）

function buildPanels() {
  const grid = document.getElementById("grid");
  for (let i = 0; i < 4; i++) {
    const el = document.createElement("div");
    el.className = "panel";
    el.innerHTML =
      '<div class="phead"><span class="dot"></span><span class="name">面板 ' + (i + 1) +
      '</span><span class="hint" data-role="sess"></span>' +
      '<span class="perf" data-role="perf"></span></div>' +
      '<div class="log" data-role="log"></div>' +
      '<div class="stat" data-role="stat"></div>' +
      '<div class="pfoot"><div class="inbox">' +
      '<textarea data-role="in" rows="1" placeholder="输入问题，Enter 发送 · Shift+Enter 换行"></textarea>' +
      '<button data-role="go" class="send" title="发送（Enter）" aria-label="发送">' +
      '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
      'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 12h14M12 6l6 6-6 6"/></svg></button>' +
      '</div></div>';
    grid.appendChild(el);

    const p = {
      el: el,
      id: i,                   // 面板号，用来生成它的对话身份（见 streamChat 的 convId）
      log: el.querySelector('[data-role=log]'),
      stat: el.querySelector('[data-role=stat]'),
      sess: el.querySelector('[data-role=sess]'),
      perf: el.querySelector('[data-role=perf]'),
      input: el.querySelector('[data-role=in]'),
      go: el.querySelector('[data-role=go]'),
      dot: el.querySelector('.dot'),
      messages: [],            // 这一路自己的对话历史 —— 多轮就靠它，也是 KV 复用的前提
      streaming: false,
      kv: "",
      ttft: null,              // 首字延迟（第一个增量到手的时间），性能小字要它
    };
    p.input.value = DEFAULT_Q[i];
    grow(p.input);
    p.input.addEventListener("input", function () { grow(p.input); });
    p.input.addEventListener("keydown", function (e) {
      // Enter 发送、**Shift+Enter 换行**。单行 input 时回车只有发送一个意思，改成
      // textarea 之后回车默认是换行（不拦的话按回车什么都不发生），所以必须显式分流。
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();     // 不然发送的同时还往框里插一个换行
        send(p);
      }
    });
    p.go.addEventListener("click", function () { send(p); });
    panels.push(p);
    render(p);
  }
}

function addMsg(p, kind, who, text) {
  const d = document.createElement("div");
  d.className = "msg " + kind;
  const w = document.createElement("span");
  w.className = "who";
  w.textContent = who;
  const b = document.createElement("span");
  b.className = "body";
  b.textContent = text;
  d.appendChild(w);
  d.appendChild(b);
  p.log.appendChild(d);
  p.log.scrollTop = p.log.scrollHeight;
  return b;
}

// 只负责"外观状态"。**不要在这里碰 p.stat**：send() 的 finally 会调 render()，
// 顺手把统计行也重写的话，流结束时刚算好的 tok/s 会被当场抹掉（踩过）。
function render(p) {
  p.el.classList.toggle("active", p.streaming);
  p.dot.classList.toggle("on", p.streaming);
  p.go.disabled = p.streaming;
}

// 统一转义。这一页的统计行有几处是**拼 HTML** 的（速率要加粗），而错误信息来自网关
// 返回的响应体——不转义就等于把服务端文本当标记塞进 DOM。自己人打自己的板卡，风险
// 不高，但"十处拼 HTML、一处忘了转义"正是这类问题最常见的形态，一开始就堵上更省事。
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// 统计行**是 HTML**、不是纯文本：调用方要拼 <b> 把速率加粗。
// 原来这里写的是 textContent —— 于是页面上直接印出字面的 `<b>11.63 tok/s</b>`，
// 标签跟着数字一起显示了很久没人发现（看起来只是"没那么粗"，不像坏了）。
function setStat(p, html) { p.stat.innerHTML = html; }

// 顶部徽标：**只放一两个词的状态**，颜色由 class 决定（CSS 的 .badge.<state>）。
// 字和色必须一起改 —— 只改字的话"生成中"和"待机"是同一个灰灯，隔着投影仪根本看不出
// 区别，而"一眼看出板卡在不在跑"正是这个徽标存在的理由。
// 逐个 remove 而**不是** remove("idle","busy",...)：桩 DOM 的 classList.remove 只认第一个
// 参数，多传的会被静默丢掉，于是桩里绿、浏览器里绿、真跑起来是花的。
function setStatus(state, text) {
  const b = document.getElementById("status");
  ["idle", "busy", "wait", "err"].forEach(function (c) { b.classList.remove(c); });
  b.classList.add(state);
  document.getElementById("gstats").textContent = text;
}

// 顶部那行汇总（基线 / 四路聚合）。空串 = 整行不占高度（CSS 的 .sumline:not(:empty)）。
function setSum(html) { document.getElementById("gsum").innerHTML = html || ""; }

// 面板头右侧的性能小字：TTFT + tok/s。**底部统计行看不见首字延迟**（它只有总耗时），
// 而"要等多久才出第一个字"恰恰是给人看并发最直观的一个数，所以这两处不算重复：
// 这里是**基准条**（首字延迟 / 速率），下面是**记账**（token 数、排队拆解、会话与 KV）。
function setPerf(p, html) {
  if (p.perf) { p.perf.innerHTML = html; }
}

// 多行输入框的高度自适应：先归零再按内容量一次，然后夹在上限里。
// `typeof scrollHeight !== "number"` 那一句是给**桩 DOM**（page_check.js）留的：它没有排版，
// 没有 scrollHeight。不挡的话那边会往 style.height 里写 "NaNpx" —— 不报错、但也没意义。
function grow(el) {
  if (!el || typeof el.scrollHeight !== "number") { return; }
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
  el.style.overflowY = el.scrollHeight > 120 ? "auto" : "hidden";
}

function parseKV(s) {
  // 形如 session=2; reset=0; sent=118; base=248; full=366
  const o = {};
  (s || "").split(";").forEach(function (part) {
    const kv = part.split("=");
    if (kv.length === 2) { o[kv[0].trim()] = kv[1].trim(); }
  });
  return o;
}

// 一次流式对话的核心：发请求、按 SSE 逐块解析、把增量交给 onDelta。
// 面板和"单路基线"共用它，免得解析逻辑写两份、改一处忘一处。
//
// convId 是**显式身份**（X-Conversation-Id），不是可有可无的装饰：不给身份时网关只能按
// "system + 首问"的内容摘要认对话，这样造出来的对话**认不出也关不掉**（只能从 /v1/pool
// 读原始 key 再关），会一直占着会话到 IDLE_TTL 超时。这一页四个面板本来就该是四段对话，
// 给它一个稳定的名字，是谁、占着哪几个会话、要不要放掉，就都是明面上的事了。
// onWait(elapsed)：**响应头还没回来**时每 200ms 叫一次。
// 必须有它：响应头是在网关拿到会话之后才发的，所以"在队列里排队"这段时间里
// `fetch` 还没 resolve、一个字节都没到——页面上只剩一个转圈，用户看到的就是
// "NPU 明明没人用，我却在干等"（2026-09-18 就是这样报上来的）。有了这个回调，
// 等待期间屏幕上写的就是"等待空闲会话 12.3s"，而不是沉默。
async function streamChat(messages, onDelta, convId, onWait) {
  const t0 = performance.now();
  let ntok = 0, nchunk = 0, answer = "";
  const headers = { "Content-Type": "application/json" };
  if (convId) { headers["X-Conversation-Id"] = convId; }
  const tick = onWait
    ? setInterval(function () { onWait((performance.now() - t0) / 1000); }, 200)
    : null;
  let res;
  try {
    res = await fetch(API + "/v1/chat/completions", {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        model: MODEL,
        messages: messages,
        max_tokens: maxtok(),
        stream: true,
        stream_options: { include_usage: true },
        chat_template_kw: { enable_thinking: document.getElementById("think").checked },
      }),
    });
  } finally {
    // 头一到就停：接下来的时间就是真的在跑模型了，由 onDelta 那条线接管。
    if (tick !== null) { clearInterval(tick); }
  }
  if (!res.ok) {
    throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0, 200));
  }
  // 自定义响应头能被 JS 读到，靠网关的 Access-Control-Expose-Headers
  const kv = parseKV(res.headers.get("X-KV-Reuse") || "");
  // 网关自己记的排队时长（秒）。拿它而不是上面那个 tick 的终值：网关是**真在队列里**
  // 计时的一方，tick 还含了 TCP/浏览器那一小段。
  const waited = Number(kv.wait || 0) || 0;

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  let finish = null;
  for (;;) {
    const r = await reader.read();
    if (r.done) { break; }
    buf += dec.decode(r.value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line.startsWith("data:")) { continue; }
      const payload = line.slice(5).trim();
      if (payload === "[DONE]") { continue; }
      let d;
      try { d = JSON.parse(payload); } catch (e) { continue; }
      // 末尾那块带 usage（stream_options.include_usage），以它的 completion_tokens 为准：
      // 自己数块数会把"块"当"token"，和板上的测量脚本口径对不上
      if (d.usage && typeof d.usage.completion_tokens === "number") {
        ntok = d.usage.completion_tokens;
      }
      const ch = d.choices && d.choices[0];
      // finish_reason 必须在取 content **之前**读：带它的那一块 delta 是空的（只有
      // `finish_reason` 有值），下面 `if (!piece) continue` 顺手就把它跳过去了——
      // 放在后面写就是永远读不到，而且不报错、统计行一直不显示"触顶"。
      if (ch && ch.finish_reason) { finish = ch.finish_reason; }
      const piece = ch && ch.delta && ch.delta.content;
      if (!piece) { continue; }
      nchunk++;
      answer += piece;
      onDelta(answer, (performance.now() - t0) / 1000, nchunk);
    }
  }
  const el = (performance.now() - t0) / 1000;
  const tok = ntok || nchunk;          // usage 没到就退化成数出来的块数
  return { tok: tok, el: el, rate: tok / el, text: answer, kv: kv, exact: !!ntok,
           finish: finish, waited: waited };
}

// 问完了就主动把会话还回去（POST /v1/conversations/close）。
// **这不是讲礼貌**：网关只排队、不抢占，一段"问一次就再也不问"的对话如果一直挂着身份，
// 它占的会话就一直占着，直到 IDLE_TTL（默认 300 秒）超时——排队的人白等五分钟，
// 而屏幕上一点异常都看不出来（排队在吞吐上是隐形的）。基线正是这种一次性对话。
// 面板**不调它**：那四段对话留着，下一批就是它们的第二轮，KV 复用演示靠的就是这个。
async function closeConv(convId) {
  try {
    await fetch(API + "/v1/conversations/close", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: convId }),
    });
  } catch (e) { /* 交还失败不影响演示：最坏就是退回"等 TTL 超时"的老行为 */ }
}

// 关页面 = 这次演示结束了，把五个身份都还回去（四个面板 + 基线）。
// 用 `sendBeacon` 而**不是** `fetch`：页面正在卸载时 fetch 会被浏览器直接取消，
// 这段代码就等于没写；sendBeacon 由浏览器代发，是 unload 里唯一靠得住的方式。
// 只在关页面时还、不在面板跑完就还：同一页里那四段对话是要留着的（第二轮看 KV 复用）。
// 正文用普通字符串（text/plain）就行——网关的 `_read_json` 只认 Content-Length，
// 不看 Content-Type；而且这个类型是"安全"的，连预检都不用发。
window.addEventListener("beforeunload", function () {
  ["web-1", "web-2", "web-3", "web-4", "web-baseline"].forEach(function (id) {
    try {
      navigator.sendBeacon(API + "/v1/conversations/close",
                           JSON.stringify({ conversation_id: id }));
    } catch (e) { /* 老浏览器没有 sendBeacon：最坏就是等 TTL 超时，不影响本页演示 */ }
  });
});

async function send(p) {
  const text = p.input.value.trim();
  if (!text || p.streaming) { return null; }
  p.input.value = "";
  grow(p.input);          // 送出去之后框要缩回一行，不然它就一直是上一条问题的身高
  addMsg(p, "u", "你", text);
  p.messages.push({ role: "user", content: text });
  const bubble = addMsg(p, "a", "模型", "");

  p.streaming = true;
  // 首字延迟是**这一轮**的事：不清掉的话，这一轮还没出第一个字时，面板头上挂着的是
  // 上一轮的数——看着像"已经出字了"，正好是最容易误判的一帧。
  p.ttft = null;
  setPerf(p, "");
  render(p);
  updateGlobal();
  try {
    // 这一路的名字**必须稳定**："web-1" 永远是这一格。改了名字就是换了对话，
    // 网关会当成新人重新分会话，多轮的 KV 复用也就没了。
    const r = await streamChat(p.messages, function (soFar, el, n) {
      bubble.textContent = soFar;
      p.log.scrollTop = p.log.scrollHeight;
      if (p.ttft === null) { p.ttft = el; }
      // 跑动中的速率按**已收到的块数**算（后端一块一块地推，块数≈token 数）。
      // 这只是流里那个"在动"的数，落账以 usage 为准（收尾那句 setPerf）。
      setPerf(p, "首字 " + p.ttft.toFixed(1) + "s · "
                 + (n / Math.max(el, 0.001)).toFixed(1) + " tok/s");
      if (p.kvSession !== undefined) {
        setStat(p, "⏳ " + el.toFixed(1) + "s · " + n + " 块 · 会话 " + p.kvSession);
      } else {
        setStat(p, "⏳ " + el.toFixed(1) + "s · " + n + " 块");
      }
    }, "web-" + (p.id + 1), function (el) {
      // 还没拿到会话。**这里一定要说话**：这几秒到几分钟里页面上本来只有一个转圈，
      // 看着像卡死，而真相是"四个会话都被别的对话占着"。写清楚是"等会话"还是
      // "等模型"，用户才不会把它当成"板卡坏了/网络断了"。
      setStat(p, "⏳ " + el.toFixed(1) + "s · 等待空闲会话…（会话都被别的对话占着）");
    });
    const kv = r.kv;
    p.kvSession = kv.session;
    if (kv.session !== undefined) { p.sess.textContent = "会话 " + kv.session; }
    p.messages.push({ role: "assistant", content: r.text });
    // 复用到底有没有生效只看 base：base 是**真正被复用的前缀长度**。
    // 别拿 reset 当判据——首次对话落在"已知为空"的会话上时是 reset=0 但 base=0，
    // 一个字都没省；照 reset 标"（复用）"就是骗人（第一版就是这么写的）。
    // 排过队就把排队的时长单独标出来：`el` 是端到端的，分母里含排队，所以那会儿算出来的
    // `tok/s` **不是解码速度**（226s 排队 + 3s 生成 = 屏幕上写着 1.57 tok/s，看着像模型慢）。
    // 把两段时间拆开摆着，是这一行最该说清楚的事。
    setStat(p, "<b>" + r.rate.toFixed(2) + " tok/s</b> · " + r.tok + " tok · "
            + r.el.toFixed(1) + "s"
            + (r.waited > 0.05
               ? "（其中排队 " + r.waited.toFixed(1) + "s，实际推理 "
                 + Math.max(0, r.el - r.waited).toFixed(1) + "s）" : "")
            + " · 会话 " + (kv.session !== undefined ? kv.session : "?")
            + (kv.full ? " · KV " + kv.sent + "/" + kv.full
                       + (Number(kv.base) > 0
                          ? "（复用 " + kv.base + "，省 "
                            + Math.round(100 * (1 - kv.sent / kv.full)) + "%）"
                          : "（全量）") : "")
            // 只在**字面**收到 length 时才标。别拿"tok 数 ≈ 设定值"去猜：后端在上下文
            // 用满时也会停，而那种情况 finish_reason 未必是 length——猜出来的标记会把
            // "上下文不够了"伪装成"上限设小了"，正是这一页最该避免的误导。
            + (r.finish === "length"
               ? " · <span style='color:var(--warn)'>触顶截断</span>" : ""));
    // 性能小字收尾：速率换成**真 token 数**（usage）算出来的那个，和统计行是同一个数。
    // 一个字都没吐出来的话首字延迟是不存在的，写"—"而不是编一个数出来。
    setPerf(p, "首字 " + (p.ttft === null ? "—" : p.ttft.toFixed(1) + "s")
               + " · <b>" + r.rate.toFixed(2) + "</b> tok/s");
    return r;
  } catch (err) {
    bubble.textContent = "出错：" + err.message;
    bubble.parentNode.className = "msg err";
    setStat(p, "失败：" + esc(err.message));
    setPerf(p, "");        // 没量到就别把上一轮的数留在头上
    return null;
  } finally {
    p.streaming = false;
    render(p);
    updateGlobal();
  }
}

// 徽标只写**状态**。四路聚合那一整句去 setSum 了 —— 以前两者共用 #gstats，
// 于是一句"合计 686 tok / 墙钟 20.1s → 聚合 34.15 tok/s · 伸缩 3.21×"要挤在标题
// 旁边那个位置，长到把标题行撑开，而且一刷新状态就被覆盖没了。
function updateGlobal() {
  const busy = panels.filter(function (p) { return p.streaming; }).length;
  if (busy > 0) {
    setStatus("busy", "生成中 " + busy + " 路");
  } else if (lastSingleRate) {
    setStatus("idle", "待机 · 基线 " + lastSingleRate.toFixed(2) + " tok/s");
  } else {
    setStatus("idle", "待机");
  }
}

// 四路汇总那一句。**这里有两种"平均"，混用会把结论说反**：
//
//   · 各路速率和 = Σ(tok_i / el_i)：每条路径**自己**跑了多快。四路同时跑时把它们相加，
//     就是"整块板此刻一共在吐多少 token"。口径和单路基线**完全一样**（都是"某一路的
//     速率"），所以伸缩比只能用这个。
//   · 墙钟摊薄 = Σtok_i / 墙钟：把总 token 摊到整段墙上。四路长度不齐时它会**凭空变小**：
//     某一路在做长生成，另外三路早答完了，后面那一大段只有一路在跑，于是"1 路的吞吐"
//     被摊进了"4 路并发"的分母——量到的不是并发性能，是"平均有几路在跑"。
//
// 实测（2026-09-18 网页四路：153/182/1602/158 tok，墙钟 135.7s）：速率和 41.42 tok/s、
// 墙钟摊薄 15.43 tok/s，而平均只有 1.37/4 路在跑。**差 2.7 倍，不是误差，是两个问题。**
// 所以：速率和当主数，摊薄值只在四路长度齐的时候才有意义，不齐就当场说明白是它被摊薄了。
//
// （原来的写法只有摊薄值这一个数，标题还写着"聚合"——四路里有一路跑了 135s 时，
//   屏幕上给出 15.43，看着跟单路基线 10.6 是一路的，"四路并发没什么用"就是这么读出来的。）
function summarize(rs, wall, baseline) {
  const n = rs.length;
  const total = rs.reduce(function (a, r) { return a + r.tok; }, 0);
  const solo  = rs.reduce(function (a, r) { return a + r.tok / Math.max(r.el, 0.001); }, 0);
  const w     = Math.max(wall, 0.001);
  const agg   = total / w;
  const den   = rs.reduce(function (a, r) { return a + r.el; }, 0) / w;
  let html = n + " 路并发：各路速率和 <b>" + solo.toFixed(2) + " tok/s</b>（合计 " + total
           + " tok / 墙钟 " + wall.toFixed(1) + "s）";
  if (den < n - 0.5) {
    // 摊薄警告：这是分母里混进了空转时间，不是"并发退化"。
    html += " · <span style='color:var(--warn)'>四路长短不齐，平均只有 " + den.toFixed(2) + "/"
          + n + " 路在跑</span>，墙钟摊薄 " + agg.toFixed(2) + " tok/s（空转的路也算进了分母，"
          + "别当并发性能看）";
  } else {
    html += " · 墙钟摊薄 " + agg.toFixed(2) + " tok/s（四路差不多同时收工，二者等价）";
  }
  if (baseline) {
    html += " · <span style='color:var(--warn)'>伸缩 " + (solo / baseline).toFixed(2)
          + "×</span>（基线 " + baseline.toFixed(2) + " tok/s，同一口径）";
  } else {
    html += " · （先点「①」量个单路基线，就能看到伸缩比）";
  }
  // 有哪一路排过队，上面的数就都不是并发性能（分母里混进了等待），必须当场说破——
  // 不然"某一路没拿到会话"的现场会被读成"并发退化"。**放整句最后**：它撤的是前面
  // 每一个数（最扎眼的是刚印出来的伸缩比），紧跟在那句话后面才收得住。
  const q = rs.filter(function (r) { return r.waited > 0.05; });
  if (q.length) {
    html += " · <span style='color:var(--warn)'>有 " + q.length + " 路排过队（最多 "
          + Math.max.apply(null, q.map(function (r) { return r.waited; })).toFixed(1)
          + "s），上面的数含伸缩比都不可引用</span>";
  }
  return html;
}

// --- 按钮 ---

// 基线**故意不占任何面板**：它要是走了面板 1，面板 1 就会多出一段历史，
// 后面"4 路同时提问"就不再是从零开始的四段对话了（而且面板 1 的输入框会被清空，
// 那一批里它会直接不发）。所以这里单独发一次请求量数，量完就丢。
//
// 但"丢"要丢得干净：量完必须 close。只有 4 个会话，基线占着 1 个不还，点「②」时
// 四路里就有一路拿不到会话——**改前**它会一路排到 IDLE_TTL（300s）超时，看起来就是
// "某一路卡住不动"，而三条腿的画面最容易被当成"并发坏了"。2026-09-18 起网关多了一级
// 「有人在等就按 contend_idle 收最闲的那段对话」，这种等待被压到秒级，但**基线照样该
// 还就得还**：交还了才是满 4 路，不然「②」永远只有三路命中 KV。
document.getElementById("baseline").addEventListener("click", async function () {
  if (panels.some(function (p) { return p.streaming; })) { return; }
  setStatus("wait", "基线测量中…");
  setSum("单路基线测量中（约 20 秒）…");
  try {
    const r = await streamChat([{ role: "user", content: "用一句话介绍杭州。" }],
                               function () {}, "web-baseline", function (w) {
      setStatus("wait", "等空闲会话 " + w.toFixed(1) + "s…");
    });
    lastSingleRate = r.rate;
    // 徽标交回 "待机 · 基线 X"（updateGlobal 会带上刚记下的那个数），一整句去汇总行。
    updateGlobal();
    setSum("单路基线：<b>" + r.rate.toFixed(2) + " tok/s</b>（" + r.tok
           + " tok / " + r.el.toFixed(1) + "s"
           + (r.waited > 0.05 ? "，其中排队 " + r.waited.toFixed(1) + "s" : "")
           + "）→ 现在点「② 4 路同时提问」");
  } catch (err) {
    setStatus("err", "基线失败");
    // 汇总行是 innerHTML（要加粗），所以错误文本必须转义 —— 它来自网关的响应体。
    setSum("基线测量失败：" + esc(err.message));
  } finally {
    // 失败也要交还：失败的那次如果已经把会话绑上了，不还就是同样堵路。
    closeConv("web-baseline");
  }
});

// 四路一起发。**独立成函数是为了能被打到**：page_check.js 直接调 runAll()，走的就是
// 用户点「②」的那条路（含 summarize + setSum）。以前这段是内联在 addEventListener 里的
// 匿名函数，检查只能自己 `panels.map(send)` 一遍——于是"汇总行到底怎么算的"这件事
// **没有任何检查覆盖**，改坏了也全绿。
//
// lastRound 把这一轮的原样结果留一份，给检查读（它拿不到 runAll 的返回值）。
let lastRound = null;
async function runAll() {
  if (panels.some(function (p) { return p.streaming; })) { return; }
  // 全都是空的就填回默认问题（第二轮之后输入框是空的，历史还在——
  // 这一批就变成"四段对话各自的第二轮"，顺带能看到 KV 复用）
  if (panels.every(function (p) { return !p.input.value.trim(); })) {
    panels.forEach(function (p, i) { p.input.value = DEFAULT_Q[i]; grow(p.input); });
  }
  const n = panels.filter(function (p) { return p.input.value.trim(); }).length;
  setStatus("busy", "生成中 " + n + " 路");
  const t0 = performance.now();
  const rs = await Promise.all(panels.map(function (p) { return send(p); }));
  const wall = (performance.now() - t0) / 1000;
  const ok = rs.filter(function (r) { return r; });
  lastRound = { rs: rs, wall: wall };
  if (!ok.length) { updateGlobal(); return; }
  setSum(summarize(ok, wall, lastSingleRate));
  // 有哪一路是**失败**回来的，徽标要当场变色：失败只写在那一路自己的统计行里，
  // 而演示时眼睛看的是中间那块聚合数——"四路里有三路成功"不该看起来像一切正常。
  // （正常收尾的徽标是 updateGlobal() 在每一路的 finally 里写的，这里覆盖它。）
  if (ok.length < n) { setStatus("err", ok.length + "/" + n + " 路成功"); }
}
document.getElementById("all").addEventListener("click", runAll);

document.getElementById("clear").addEventListener("click", resetAll);

function resetAll() {
  panels.forEach(function (p, i) {
    p.messages = [];
    p.log.innerHTML = "";
    p.sess.textContent = "";
    p.stat.textContent = "";
    p.input.value = DEFAULT_Q[i];
    grow(p.input);
    p.ttft = null;
    setPerf(p, "");          // 头上那格性能小字也是"上一次的结果"，一起清
    p.lastRate = null;
    // 「清空」= 这四段对话我不要了。历史已经删了，留着会话也只是占着不放：
    // 显式交还，后面的人（或下一次演示）立刻能用满 4 个会话。
    closeConv("web-" + (i + 1));
  });
  lastSingleRate = null;
  setSum("");
  updateGlobal();
}

buildPanels();
updateGlobal();
</script>
